spring.application.name=bank-simulator-1
server.port:9090
spring.datasource.url=jdbc:mysql://localhost:3306/bank_simulator
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

simulator.bank-name=BillDesk Bank Simulator
simulator.port=9090
simulator.default-delay-ms=0
simulator.max-delay-ms=30000
simulator.callback-enabled=true

billdesk.return-url=http://localhost:9090/bank/callback
billdesk.verification-url=http://localhost:9090/bank/verification
billdesk.callback-url=http://localhost:9090/bank/callback
billdesk.org-id=
billdesk.api-key=

bank.callback.connect-timeout-ms=3000
bank.callback.read-timeout-ms=5000
bank.security.checksum-key=TEST123
bank.encryption-key=
bank.encryption-iv=

logging.level.root=INFO
logging.level.com.billdesk.banksimulator=INFO