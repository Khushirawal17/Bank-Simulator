<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Method | BillDesk Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">BillDesk</div>
    <div class="secure">🔒 Secure Payment</div>
  </header>

  <main class="container narrow">
    <div class="steps">
      <span class="active">1 Payment</span>
      <span>2 Bank</span>
      <span>3 Result</span>
    </div>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Payment details</p>
          <h1>Choose payment method</h1>
        </div>
        <div class="amount" id="checkoutAmount">₹999.00</div>
      </div>

      <div class="method-tabs">
        <button class="method active">Net Banking</button>
        <button class="method disabled" disabled>UPI</button>
        <button class="method disabled" disabled>Cards</button>
      </div>

      <div class="field">
        <label>Payment Method</label>
        <div class="select-like">Net Banking <span>✓</span></div>
      </div>

      <div class="field">
        <label>Bank</label>
        <select id="bank">
          <option>DBS Corporate Bank</option>
        </select>
      </div>

      <div class="summary">
        <div><span>Merchant</span><strong id="merchantName">Demo Merchant</strong></div>
        <div><span>Amount</span><strong id="summaryAmount">₹999.00</strong></div>
      </div>

      <button class="primary full" onclick="goToScenarios()">Pay Now</button>
      <button class="text-button" onclick="goBack()">← Back</button>
    </section>
  </main>


  <div id="receiptModal" class="receipt-modal">

  <div class="receipt-popup">

    <h2>Payment Receipt</h2>

    <div class="receipt-row">
      <strong>Scenario</strong>
      <span id="receiptScenario"></span>
    </div>

    <div class="receipt-row">
      <strong>Status</strong>
      <span id="receiptStatus"></span>
    </div>

    <div class="receipt-row">
      <strong>PRN</strong>
      <span id="receiptPrn"></span>
    </div>

    <div class="receipt-row">
      <strong>Amount</strong>
      <span id="receiptAmount"></span>
    </div>

    <button
      class="primary full"
      onclick="document.getElementById('receiptModal').style.display='none'">
      Close
    </button>

  </div>

</div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
